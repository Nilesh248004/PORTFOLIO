<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;font-size:1px;line-height:1px;">{{name}} wrote: {{message}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f7ff;padding:24px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;table-layout:fixed;background-color:#ffffff;border:1px solid #dbe3f5;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0b1530;word-wrap:break-word;overflow-wrap:break-word;word-break:break-word;">
        <tr>
          <td style="padding:24px 28px 4px 28px;">
            <div style="font-size:13px;font-weight:600;color:#2563eb;">Portfolio contact form</div>
            <div style="font-size:22px;line-height:1.3;font-weight:700;margin-top:6px;color:#0b1530;">New message from {{name}}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 28px 0 28px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="table-layout:fixed;">
              <tr>
                <td style="width:84px;padding:6px 0;font-size:13px;color:#5b6b8c;vertical-align:top;">From</td>
                <td style="padding:6px 0;font-size:15px;color:#0b1530;word-wrap:break-word;overflow-wrap:break-word;word-break:break-word;">{{name}}</td>
              </tr>
              <tr>
                <td style="width:84px;padding:6px 0;font-size:13px;color:#5b6b8c;vertical-align:top;">Email</td>
                <td style="padding:6px 0;font-size:15px;word-wrap:break-word;overflow-wrap:break-word;word-break:break-word;"><a href="mailto:{{email}}" style="color:#2563eb;text-decoration:none;">{{email}}</a></td>
              </tr>
              <tr>
                <td style="width:84px;padding:6px 0;font-size:13px;color:#5b6b8c;vertical-align:top;">Received</td>
                <td style="padding:6px 0;font-size:15px;color:#0b1530;">{{time}}</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 28px 0 28px;">
            <div style="font-size:13px;color:#5b6b8c;margin-bottom:8px;">Message</div>
            <div style="background-color:#f4f7ff;border-left:4px solid #2563eb;border-radius:6px;padding:16px 18px;font-size:16px;line-height:1.6;color:#0b1530;white-space:pre-wrap;word-wrap:break-word;">{{message}}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 28px 8px 28px;">
            <a href="mailto:{{email}}?subject=Re%3A%20Your%20message%20on%20my%20portfolio" style="display:inline-block;background-color:#2563eb;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;padding:12px 22px;border-radius:8px;">Reply to {{name}}</a>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 28px 24px 28px;font-size:12px;line-height:1.5;color:#7a89a8;">Sent from the contact form on your portfolio.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
